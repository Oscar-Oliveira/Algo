<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algo — entrar</title>
  <link rel="icon" href="/estatico/favicon.ico">
  <link rel="stylesheet" href="/estatico/estilo.css">
</head>

<body class="pagina-entrada">
  <main class="cartao-entrada">
    <div class="marca">
      <img src="/estatico/algo-logo.svg" alt="" class="marca-simbolo">
      <h1>Algo</h1>
    </div>
    <p class="subtitulo">Aprende algoritmia escrevendo. Pede ajuda a Alguem sem nunca perderes o fio à meada.</p>

    <div class="alternador" role="tablist">
      <button class="alternador-botao ativo" data-alvo="entrar">Entrar</button>
      <button class="alternador-botao" data-alvo="registar">Criar conta</button>
    </div>

    <form id="form-entrar" class="formulario">
      <label>Email
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Entrar</button>
      <p class="mensagem-erro" data-form="entrar"></p>
    </form>

    <form id="form-registar" class="formulario escondido">
      <label>Email
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="new-password" minlength="8">
        <span class="ajuda-campo">Pelo menos 8 caracteres.</span>
      </label>
      <button type="submit">Criar conta</button>
      <p class="mensagem-erro" data-form="registar"></p>
    </form>
  </main>
  <script src="/estatico/entrar.js"></script>
</body>

</html>
