services:
  algo-online:
    build:
      # o contexto tem de ser a pasta-mãe (onde algo_lang/, alguem/,
      # online/ e exemplos/ são irmãs) -- o Dockerfile precisa de
      # copiar as quatro, não só o online/ onde este ficheiro vive
      context: ..
      dockerfile: online/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # aponta para o serviço 'bd' abaixo -- a password/utilizador reais
      # continuam no .env (POSTGRES_USER/POSTGRES_PASSWORD), nunca aqui
      ONLINE_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@bd:5432/${POSTGRES_DB}"
    # ON-04: limite de processos por cgroups (não RLIMIT_NPROC -- esse
    # é um contador por UID do kernel, partilhado com processos fora do
    # contentor, e por isso não fiável para conter um fork-bomb aqui;
    # pids_limit é isolado por contentor, o mecanismo correto).
    pids_limit: 512
    depends_on:
      bd:
        condition: service_healthy
    restart: unless-stopped

  bd:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      # os dados (contas, grupos, credenciais, logs de atividade)
      # sobrevivem a um `docker compose down` -- só desaparecem com
      # `docker compose down -v`
      - algo_dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  algo_dados_postgres:
